# Builds the Windows .exe on a GitHub-hosted Windows machine, so no Python is
# needed locally. Each build is published as a zip on the repo's Releases page
# ("PDF OCR Layer Tool - latest build"), and also attached to the run as an
# artifact.
name: Build Windows exe

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "app/**"
      - "main.py"
      - "tessdata/**"
      - "build.bat"
      - "requirements*.txt"
      - "READ ME FIRST.txt"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: "python -m pip install --only-binary=:all: -r requirements-dev.txt"

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build exe
        shell: cmd
        env:
          PYTHON: python
        run: build.bat

      - name: Package zip
        shell: pwsh
        run: |
          $name = "PDF OCR Layer Tool v1.1"
          New-Item -ItemType Directory -Path "package\$name" | Out-Null
          Copy-Item "dist\PDF OCR Layer Tool.exe" "package\$name\"
          Copy-Item "dist\READ ME FIRST.txt" "package\$name\"
          Compress-Archive -Path "package\$name" -DestinationPath "PDF-OCR-Layer-Tool-v1.1.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-OCR-Layer-Tool-v1.1
          path: PDF-OCR-Layer-Tool-v1.1.zip

      - name: Publish to Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=latest-build
          notes="Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download the zip, extract it, run 'PDF OCR Layer Tool.exe'."
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" PDF-OCR-Layer-Tool-v1.1.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "PDF OCR Layer Tool - latest build" --notes "$notes"
